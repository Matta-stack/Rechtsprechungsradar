name: Rechtsprechung aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"   # täglich ca. 6:17 Uhr deutscher Zeit
  workflow_dispatch:        # manuell startbar ("Run workflow")
    inputs:
      tage:
        description: "Wie viele Tage zurück suchen? (leer = 14; für den ersten Aufbau z. B. 120)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Neue Entscheidungen holen und einordnen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOKBACK_DAYS: ${{ inputs.tage }}
        run: python -m tracker.run
      - name: Daten speichern
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/decisions.json
          git diff --cached --quiet || git commit -m "Neue Entscheidungen $(date +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
